general:
  # buildVersion: ""  # top-level build version applied to all cloud-pipeline images
  namespace: default
  # Optional private registry credentials. Set user+password or secret (not both).
  # Leave all fields empty (default) to disable imagePullSecrets on all deployments.
  imagePullCredentials:
    registry: ""    # registry hostname, e.g. my-registry.example.com
    user: ""
    password: ""
    secret: ""      # name of a pre-existing docker-registry Secret

resources:
  config:
    CP_CLOUD_PLATFORM: aws  # aws | azure | gcp
    CP_CLOUD_REGION_ID: "<us-east-1>"  # Primary AWS region ID
    CP_DEFAULT_ADMIN_NAME: "<admin>"
    CP_DEFAULT_ADMIN_EMAIL: "<admin@example.com>"
  customDNS:
    entries: []
    # - ip: "203.0.113.5"
    #   host: "external-rds.corp.internal"

# enabled: in-cluster IdP (Deployment and Service).
idp:
  enabled: false
  service:
    host:
      external: ""

# configuration for cp-api-srv deployment
apiSrv:
  service:
    host:
      external: "<api.example.com>"

  highAvailability:
    enabled: false
    replicas: 2

  db:
    # internal (bundled Postgres pod) | external (RDS or managed Postgres)
    type: internal
    db: pipeline
    user: pipeline
    pass: "<db-password>"

  cloudRegion:
    kmsKeyArn: "arn:aws:kms:us-east-1:000000000000:key/00000000-0000-0000-0000-000000000000"  # Full ARN: arn:aws:kms:<region>:<account>:key/<id>
    kmsKeyId: "<key-id>"      # Key ID (UUID portion of the ARN)
    sshKeyName: "<ec2-key-pair-name>"  # AWS EC2 key pair name (not a file path)
    tempCredentialsRole: ""   # IAM role ARN for temporary S3 credentials
    backupDuration: 20        # S3 object backup retention in days
    omicsServiceRole: ""      # IAM role ARN for AWS HealthOmics
    omicsEcrUrl: ""           # ECR registry URL, e.g. <account>.dkr.ecr.<region>.amazonaws.com
    #corsRules: ""            # JSON string override; omit (keep commented out) to use hooks/post-deploy/assets/storage.cors.policy.json
    fileShareMounts: []
    # - mountRoot: "fs-xxx.efs.us-east-1.amazonaws.com"
    #   mountType: "NFS"  # NFS | SMB
    #   mountOptions: ""

  config:
    CP_PREF_UI_PIPELINE_DEPLOYMENT_NAME: ""
    CP_KUBE_EXTERNAL_HOST: "0.0.0.0"
    CP_API_SRV_SSO_ENDPOINT_ID: ""
    CP_PREF_STORAGE_SYSTEM_STORAGE_NAME: ""

dockerRegistry:
  enabled: true
  service:
    host:
      external: "<docker.example.com>"
  config:
    CP_DOCKER_STORAGE_CONTAINER: "<docker-s3-bucket>"

edge:
  region: "<us-east-1>"      # AWS region of this edge node
  externalIP: "<edge-node-public-ip>"  # Public IP of edge node (used in DNS and run endpoints)
  service:
    host:
      external: "<edge.example.com>"

# GitLab (cp-git). Set enabled: false to skip the release (and cp-edge will not wait on cp-git).
git:
  enabled: true
  patchDNS:
    enabled: true
  service:
    host:
      external: "<git.example.com>"
  gitlab:
    internalHttpPort: 443
  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: git-15
    pullPolicy: IfNotPresent
  config:
    CP_GITLAB_SSO_ENDPOINT_ID: ""
    CP_GITLAB_SSO_TARGET_URL: ""
    CP_GITLAB_SSO_TARGET_URL_TRAIL: ""
    GITLAB_ROOT_PASSWORD: "<gitlab-root-password>"

# Search (cp-search-srv, cp-search-elk, cp-search-elk-curator). Matches EPM-CMBI deploy k8s/cp-search/*.yaml + install.sh cp-search block; label nodes cloud-pipeline/cp-search-srv / cp-search-elk.
search:
  enabled: false
  elk:
    elasticsearch:
      enabled: true
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: search-elk
  curator:
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: search-elk-curator
  srv:
    mode: default  # default | nfsEvents | nfsOnly
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: search

# Billing report agent (cp-billing-srv). Syncs billing data to Elasticsearch; requires cloud-pipeline/cp-billing-srv=true on a node (see install.sh).
billing:
  enabled: true
  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: billing-srv
    pullPolicy: Always

# Email notifier (cp-notifier). Patches cp-config-global with CP_NOTIFIER_* from structured smtp/azure/ui settings; requires cloud-pipeline/cp-notifier=true on a node (see install.sh).
notifier:
  enabled: false
  smtp:
    enabled: false
    server:
      host: ""
      port: ""  # e.g. 587 (STARTTLS) or 465 (SSL)
    sslOnConnect: false  # true = SSL/TLS from first connect; false = plain or STARTTLS
    startTls: true       # true = STARTTLS upgrade (used when sslOnConnect is false)
    from: ""
    user: ""
    pass: ""
  ui:
    enabled: true
  azure:
    enabled: false
    tenantId: ""
    clientId: ""
    clientSecret: ""
    scopes: "https://graph.microsoft.com/.default"
    sender: ""
    dryRun: false  # true = log emails without sending (test mode)
  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: notifier
    pullPolicy: Always  # IfNotPresent | Always | Never

monitoring:
  enabled: true
  heapster:
    enabled: true
    elk:
      image:
        repository: quay.io/lifescience/cloud-pipeline
        tag: heapster-elk
      dataHostPath: /opt/heapster-elk/data  # Node local path for Elasticsearch data
  nodeLogger:
    enabled: true
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: node-logger
  nodeReporter:
    enabled: true
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: node-reporter
  vmMonitor:
    enabled: true
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: vm-monitor
    logsHostPath: /opt/vm-monitor/logs  # Node local path for vm-monitor log files

# Storage lifecycle service (cp-storage-lifecycle-service). Archives/restores S3 objects between storage classes.
# Requires node label cloud-pipeline/cp-storage-lifecycle-service=true.
storageLifecycle:
  enabled: true
  archive:
    startAt: "23:00"  # Time of day to run the archive job (HH:MM)
  restore:
    startEach: "20"   # Interval in minutes between restore checks
  reportBucketPrefix: "storage-lifecycle-service/tagging-job-reports"  # S3 key prefix for job reports; applied to all regions unless overridden per-region via slsProperties
  # Per-region overrides. Inline list or path to a JSON file.
  # Each entry: awsRegionId (required), slsRoleArn or full slsProperties object.
  regions: []
  # - awsRegionId: "us-east-1"          # use slsRoleArn to override the S3 Batch Operations role
  #   slsRoleArn: "arn:aws:iam::<account-id>:role/cp-sls-role"
  # - awsRegionId: "eu-west-1"          # use slsProperties to set all properties explicitly
  #   slsProperties:
  #     properties:
  #       batch_operation_job_aws_account_id: "<account-id>"
  #       batch_operation_job_role_arn: "arn:aws:iam::<account-id>:role/cp-sls-role"
  #       batch_operation_job_report_bucket: "my-bucket"
  #       batch_operation_job_report_bucket_prefix: "storage-lifecycle-service/tagging-job-reports"
  #       batch_operation_job_poll_status_retry_count: "30"
  #       batch_operation_job_poll_status_sleep_sec: "5"
  #       storage_skip_archiving_tag: "disable_storage_lifecycle"
  # or: regions: "./path/to/sls-regions.json"
  
# WebDAV service (cp-dav). Provides WebDAV access to Cloud Pipeline storage.
# Requires node label cloud-pipeline/cp-dav=true.
dav:
  enabled: true
  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: dav
    pullPolicy: Always

# Data sharing service (cp-share-srv). Requires idp.enabled: true or an external IdP configured in cp-api-srv.
# cp-share-srv-pki-secret must exist before deployment (created by helm/prerequisites/create-cp-secrets.sh).
shareSrv:
  enabled: false
  service:
    host:
      external: ""   # e.g. share.example.com
      # internal: ""  # defaults to cp-share-srv.<namespace>.svc.cluster.local
    port:
      external: "443"
      internal: "31084"
  config: {}
  # config:
  #   CP_API_SRV_ANONYMOUS_URLS: "/restapi/route,/restapi/whoami,/restapi/static-resources/**,/restapi/datastorage/**"

# Run policy manager (cp-run-policy-manager). Evaluates and enforces run lifecycle policies.
runPolicyManager:
  enabled: false
  pollPeriodSec: "5"
  kubeConfigHostPath: /root/.kube
  logsHostPath: /opt/run-policy-manager/logs

postDeploy:
  enabled: false  # true = run post-deploy cleanup hooks (wait-for-api, register tools/prefs/etc); false = skip (safe for helmfile template checks)

  registerDockerTools: true  # run register-docker-tools.sh
  # Docker tools to push to the docker registry and register in Cloud Pipeline as tools.
  dockers:
    - "library/rockylinux:latest"
    - "library/nextflow:latest"

  applyPreferences: true  # run apply-preferences.sh
  # Path to a custom preferences JSON file or directory (same format as hooks/assets/preferences/).
  # Merged after all defaults; entries here win on conflict. Leave empty to skip.
  # Can also be set via the CP_SYSTEM_PREFERENCE_CONFIG env var before running helmfile.
  systemPreferenceConfig: ""

  applyClusterNetworksConfig: true  # run apply-cluster-networks-config.sh
  # Defines the cluster.networks.config API preference for worker node pools.
  # Leave empty ({}) to skip. Can also be set to a path of a JSON file with the same structure.
  clusterNetworksConfig: {}
  # tags: {}                    # Optional: instance tags applied to all worker nodes (key-value pairs).
  #                             # Default: {<CP_VM_MONITOR_INSTANCE_TAG_NAME>: <value>} or {monitored: "true"}.
  # regions:
  #   - name: ""            # AWS region ID; omit or leave empty to use CP_CLOUD_REGION_ID
  #     networks: {}            # Map of subnet-id to network-name, e.g. { "subnet-xxx": "my-net" }
  #     amis:
  #       - ami: "ami-..."      # Required: explicit AMI ID (null and empty are rejected)
  #         # platform: linux   # linux (default) | windows
  #         # instance_mask: "*"  # Instance type glob, e.g. "p*" for GPU instances
  #         # init_script: ""   # Override default init script path for this AMI
  #     securityGroupIds: []    # Security group IDs to attach to worker nodes
  #     # proxies: [{name: "dns_proxy_post", path: "10.96.0.10"}]  # Default: CoreDNS from CP_EDGE_CLUSTER_RESOLVER
  #     # swap: [{name: "swap_ratio", path: "0.01"}]               # Default: 0.01

  registerAdditionalCloudRegions: true  # run register-additional-cloud-regions.sh
  # Additional (non-default) AWS cloud regions to register after deployment.
  # Each entry uses the same field names as apiSrv.cloudRegion; regionId and kmsKeyArn are required.
  additionalCloudRegions: []
  # - regionId: "us-east-2"          # AWS region ID (required)
  #   kmsKeyArn: ""                   # Full ARN: arn:aws:kms:<region>:<account>:key/<id> (required)
  #   kmsKeyId: ""                    # Key ID (UUID portion of the ARN)
  #   sshKeyName: ""                  # AWS EC2 key pair name
  #   tempCredentialsRole: ""         # IAM role ARN for temporary S3 credentials
  #   backupDuration: 20              # S3 object backup retention in days
  #   omicsServiceRole: ""            # IAM role ARN for AWS HealthOmics
  #   omicsEcrUrl: ""                 # ECR registry URL
  #   corsRules: ""                   # JSON string; empty = use hooks/post-deploy/assets/storage.cors.policy.json
  #   fileShareMounts: []
  #   # - mountRoot: "fs-xxx.efs.us-east-2.amazonaws.com:/"
  #   #   mountType: "NFS"  # NFS | SMB
  #   #   mountOptions: ""

  registerEmailTemplates: true  # run register-email-templates.sh
  # Template names match hooks/post-deploy/assets/email-templates/configs/<NAME>.json
  emailNotifications:
    # If non-empty, only these types are enabled; all others get enabled=false (bodies still uploaded).
    enableOnly: []
    # enableOnly:
    #   - IDLE_RUN
    #   - LONG_RUNNING

  restartApiSrv: true  # run restart-cp-api-srv.sh

