# Used by lib.cpConfigGlobal.patchHookTemplate to derive the configmap-to-update-* name
service:
  name: cp-share-srv
  host:
    external: ""  # set to edge/public hostname for sharing URLs; defaults to internal host
    internal: ""  # defaults to cp-share-srv.<namespace>.svc.cluster.local
  port:
    external: "443"
    internal: "443"  # Service port (container listens on 8080)

enabled: true
# buildVersion: ""  # overrides general.buildVersion for this release

image:
  repository: quay.io/lifescience/cloud-pipeline
  tag: share-srv
  # buildVersion: ""  # overrides general.buildVersion for this image
  pullPolicy: Always  # IfNotPresent | Always | Never

pkiHostPath: /opt/share-srv/pki        # Runtime PKI material generated by the service
logsHostPath: /opt/share-srv/logs      # Node local path for log files
idpPkiHostPath: /opt/idp/pki           # IDP PKI shared with cp-idp
commonPkiHostPath: /opt/common/pki     # Common PKI (read-only)
prefsHostPath: /opt/share-srv/prefs    # Runtime preferences (read-only)
staticHostPath: /opt/share-srv/static  # Static web assets (read-only)

sharedStorageName: "SharedStorages"  # CP folder created/used as container for shared storage entries (data.sharing.storage.folders.directory)

idp:
  enabled: false  # Enables IdP metadata fetch and IdP registration hooks. Auto-set by helmfile from top-level idp.enabled.

config:
  CP_SHARE_SRV_CERT_DIR: /opt/share-srv/pki
  CP_SHARE_SRV_FED_META_DIR: /opt/share-srv/sso
  CP_SHARE_SRV_SAMPLE_ROLE_CLAIMS: groups
  CP_SHARE_SRV_STATIC_DIR: /opt/share-srv/static
  CP_API_SRV_ANONYMOUS_URLS: /restapi/route,/restapi/whoami,/restapi/static-resources/**,/restapi/datastorage/**
