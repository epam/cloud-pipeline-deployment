{{- if .Values.enabled -}}
{{- $service := .Values.service | default dict -}}
{{- $serviceHost := index $service "host" | default dict -}}
{{- $servicePort := index $service "port" | default dict -}}
{{- $config := .Values.config | default dict -}}
{{- $internalHost := index $serviceHost "internal" | default "" | toString -}}
{{- $externalHost := index $serviceHost "external" | default "" | toString -}}
{{- $internalPort := index $servicePort "internal" | default "31084" | toString -}}
{{- $externalPort := index $servicePort "external" | default "31084" | toString -}}
{{- if eq $internalHost "" -}}
{{- if ne $externalHost "" -}}
{{- $internalHost = $externalHost -}}
{{- $internalPort = $externalPort -}}
{{- else -}}
{{- $internalHost = printf "cp-share-srv.%s.svc.cluster.local" (include "lib.application.namespace" .) -}}
{{- end -}}
{{- end -}}
{{- $data := dict -}}
{{- $_ := set $data "CP_SHARE_SRV_INTERNAL_HOST" $internalHost -}}
{{- $_ := set $data "CP_SHARE_SRV_INTERNAL_PORT" $internalPort -}}
{{- $_ := set $data "CP_SHARE_SRV_EXTERNAL_HOST" $externalHost -}}
{{- $_ := set $data "CP_SHARE_SRV_EXTERNAL_PORT" $externalPort -}}
{{- range $key, $value := $config -}}
{{- $_ := set $data $key ($value | toString) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-to-update-{{ .Values.service.name }}
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{ include "lib.cpConfigGlobal.patchHookTemplate" (dict "context" . "hookWeight" "-8") }}
{{- end }}
