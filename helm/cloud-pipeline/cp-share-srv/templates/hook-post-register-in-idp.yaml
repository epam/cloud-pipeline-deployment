{{- if and .Values.enabled (index (.Values.idp | default dict) "enabled" | default false) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cp-hook-script-register-share-in-idp
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  register-share-in-idp.sh: |
{{ .Files.Get "files/hooks/register-share-in-idp.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cp-register-share-in-idp
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "11"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      serviceAccountName: {{ include "lib.hook.serviceaccount" . }}
      restartPolicy: Never
      containers:
        - name: register-share-in-idp
          image: {{ include "lib.hook.deploymentImage" . | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ include "lib.application.namespace" . | quote }}
          envFrom:
            - configMapRef:
                name: cp-config-global
          command: ["/bin/bash", "/scripts/register-share-in-idp.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: cp-hook-script-register-share-in-idp
            defaultMode: 0755
{{- end }}
