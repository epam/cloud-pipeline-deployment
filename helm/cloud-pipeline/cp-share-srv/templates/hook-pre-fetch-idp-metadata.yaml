{{- if and .Values.enabled (index (.Values.idp | default dict) "enabled" | default false) }}
apiVersion: v1
kind: Secret
metadata:
  name: cp-share-srv-fed-metadata-secret
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  cp-share-srv-fed-meta.xml: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cp-hook-script-fetch-share-fed-meta
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  fetch-share-fed-meta.sh: |
{{ .Files.Get "files/hooks/fetch-share-fed-meta.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cp-fetch-share-fed-meta
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      serviceAccountName: {{ include "lib.hook.serviceaccount" . }}
      restartPolicy: Never
      containers:
        - name: fetch-share-fed-meta
          image: {{ include "lib.hook.deploymentImage" . | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ include "lib.application.namespace" . | quote }}
          envFrom:
            - configMapRef:
                name: cp-config-global
          command: ["/bin/bash", "/scripts/fetch-share-fed-meta.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: cp-hook-script-fetch-share-fed-meta
            defaultMode: 0755
{{- end }}
