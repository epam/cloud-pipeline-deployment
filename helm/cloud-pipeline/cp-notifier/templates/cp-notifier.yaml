apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-notifier
  namespace: {{ include "lib.application.namespace" . }}
spec:
  selector:
    matchLabels:
      cloud-pipeline/cp-notifier: "true"
  replicas: 1
  template:
    metadata:
      labels:
        cloud-pipeline/cp-notifier: "true"
        cloud-pipeline/core-component: "Deployment"
    spec:
      nodeSelector:
        cloud-pipeline/cp-notifier: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cp-notifier
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/init"]
          envFrom:
            - configMapRef:
                name: cp-config-global
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /liveness.sh
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - mountPath: /opt/notifier/logs
              name: notifier-logs
      volumes:
        - name: notifier-logs
          hostPath:
            path: /opt/notifier/logs
            type: DirectoryOrCreate
      imagePullSecrets:
        - name: cp-distr-docker-registry-secret
