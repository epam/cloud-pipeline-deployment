{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: cp-api-srv-fed-metadata-secret
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  cp-api-srv-fed-meta.xml: ""
{{- end }}
