{{- if .Values.enabled }}
{{- $namespace := include "lib.application.namespace" . -}}
{{- $service := .Values.service | default dict -}}
{{- $serviceHost := index $service "host" | default dict -}}
{{- $servicePort := index $service "port" | default dict -}}
{{- $internalHost := index $serviceHost "internal" | default "" | toString | trim -}}
{{- $externalHost := index $serviceHost "external" | default "" | toString | trim -}}
{{- $internalPort := index $servicePort "internal" | default "443" | toString | trim -}}
{{- $externalPort := index $servicePort "external" | default "443" | toString | trim -}}

{{- if and (ne $externalHost "") (eq $internalHost "") -}}
{{- $internalHost = $externalHost -}}
{{- $internalPort = $externalPort -}}
{{- end -}}

{{- if eq $internalHost "" -}}
{{- $internalHost = printf "cp-idp.%s.svc.cluster.local" $namespace -}}
{{- end -}}

{{- $data := dict -}}
{{- $_ := set $data "CP_IDP_EXTERNAL_HOST" $externalHost -}}
{{- $_ := set $data "CP_IDP_EXTERNAL_PORT" $externalPort -}}
{{- $_ := set $data "CP_IDP_INTERNAL_HOST" $internalHost -}}
{{- $_ := set $data "CP_IDP_INTERNAL_PORT" $internalPort -}}
{{- range $key, $value := (.Values.config | default dict) -}}
{{- $_ := set $data $key ($value | toString) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-to-update-cp-idp
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{ include "lib.cpConfigGlobal.patchHookTemplate" (dict "context" . "hookWeight" "-5") }}
{{- end }}