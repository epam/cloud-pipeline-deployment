# Used by lib.cpConfigGlobal.patchHookTemplate to derive the configmap-to-update-* name
service:
  name: cp-monitoring-srv

# Top-level toggle for helmfile installed:
enabled: true
# buildVersion: ""  # overrides general.buildVersion for this release

# heapster v1.5.4: retired, and it reads kubelet endpoints that current Kubernetes releases no longer serve. Replaced by
# metricsCollector below. Enable it again only to run it beside the collector for a comparison, with
# metricsCollector.index set to another name. heapster.elk is the metrics store of both, and runs when either does.
heapster:
  enabled: false

  metricResolution: "30s"  # Kubernetes metrics scrape interval (e.g. 30s, 1m)

  image:
    repository: k8s.gcr.io/heapster-amd64
    tag: v1.5.4
    pullPolicy: Always  # IfNotPresent | Always | Never

  service:
    name: cp-heapster
    port:
      internal: "30095"

  elk:
    image:
      repository: quay.io/lifescience/cloud-pipeline
      tag: heapster-elk
      # buildVersion: ""  # overrides general.buildVersion for this image
      pullPolicy: Always  # IfNotPresent | Always | Never

    service:
      name: cp-heapster-elk
      port:
        internal: "30094"

    dataHostPath: /opt/heapster-elk/data  # Node local path for Elasticsearch data
    readinessTimeoutSec: 300  # Seconds to wait for Elasticsearch readiness before failing

# cp-metrics-collector: reads the kubelets' /stats/summary and /metrics/cadvisor and writes heapster's documents into
# the heapster-YYYY.MM.dd indices of heapster.elk, where the API and the deployment autoscaler read them.
# Works on Kubernetes 1.15 and current releases. Source: deploy/docker/cp-metrics-collector in epam/cloud-pipeline.
metricsCollector:
  enabled: true

  metricResolution: "30s"  # batch interval (e.g. 30s, 1m), as heapster's metric resolution

  # Empty: `heapster`, the indices the platform reads. Set another name to run beside heapster for a comparison
  # (e.g. cp-metrics-collector): never one that starts with `heapster-`, which the API's index retention cannot parse.
  index: ""

  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: metrics-collector
    # buildVersion: ""  # overrides general.buildVersion for this image
    pullPolicy: Always  # IfNotPresent | Always | Never

  serviceAccount: cp-metrics-collector  # also the name of its ClusterRole and ClusterRoleBinding

  # Where it runs: heapster's node, whose label existing AMIs set already
  nodeSelector:
    cloud-pipeline/cp-heapster: "true"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

nodeLogger:
  enabled: true

  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: node-logger
    # buildVersion: ""  # overrides general.buildVersion for this image
    pullPolicy: Always  # IfNotPresent | Always | Never

nodeReporter:
  enabled: true

  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: node-reporter
    # buildVersion: ""  # overrides general.buildVersion for this image
    pullPolicy: Always  # IfNotPresent | Always | Never

  hostPath:
    logs: /opt/node-reporter/logs
    resources: /opt/node-reporter/resources

vmMonitor:
  enabled: true

  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: vm-monitor
    # buildVersion: ""  # overrides general.buildVersion for this image
    pullPolicy: Always  # IfNotPresent | Always | Never

  logsHostPath: /opt/vm-monitor/logs  # Node local path for vm-monitor log files

  # The deployments vm-monitor checks (CP_VM_MONITOR_DEPLOY_NAMES): the list built into vm-monitor, with the metrics
  # deployments left out. cp-heapster and/or cp-metrics-collector are added as they are enabled, so that the
  # one that does not run is not reported missing. Set CP_VM_MONITOR_DEPLOY_NAMES in `config` to take over the list.
  deploymentNames:
    - cp-api-db
    - cp-api-srv
    - cp-notifier
    - cp-git
    - cp-git-sync
    - cp-edge
    - cp-docker-registry
    - cp-docker-comp
    - cp-clair
    - cp-search-elk
    - cp-search-srv
    - cp-heapster-elk
    - cp-share-srv
    - cp-dav

monitoringSrv:
  enabled: true
  image:
    repository: quay.io/lifescience/cloud-pipeline
    tag: monitoring-service
    # buildVersion: ""  # overrides general.buildVersion for this image
    pullPolicy: Always  # IfNotPresent | Always | Never
  logsHostPath: /opt/monitoring/logs  # Node local path for monitoring-srv log files

config:
  CP_VM_MONITOR_HOUR_INTERVAL: "1"
  CP_VM_MONITOR_INSTANCE_TAG_NAME: monitored
  CP_VM_MONITOR_INSTANCE_TAG_VALUE: "true"
  CP_VM_MONITOR_REQUIRED_LABELS: runid
  CP_VM_MONITOR_RUN_ID_LABEL: Name
  CP_VM_MONITOR_TO_USER: ""
  CP_VM_MONITOR_CC_USERS: ""
  CP_VM_MONITOR_DEPLOY_MIN_INTERVAL: "5"
  CP_VM_MONITOR_DEPLOY_NAMESPACE: default
  CP_HEAPSTER_METRIC_RESOLUTION: 30s
