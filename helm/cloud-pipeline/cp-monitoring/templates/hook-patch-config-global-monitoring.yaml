{{- if or .Values.heapster.enabled .Values.metricsCollector.enabled }}
{{- $namespace := include "lib.application.namespace" . }}
{{- $elkInternalHost := printf "%s.%s.svc.cluster.local" .Values.heapster.elk.service.name $namespace }}
{{- $elkInternalPort := .Values.heapster.elk.service.port.internal | toString }}
{{- $data := dict -}}
{{- $_ := set $data "CP_HEAPSTER_ELK_INTERNAL_HOST" $elkInternalHost -}}
{{- $_ := set $data "CP_HEAPSTER_ELK_INTERNAL_PORT" $elkInternalPort -}}
{{- if .Values.heapster.enabled }}
{{- $heapsterInternalHost := printf "%s.%s.svc.cluster.local" .Values.heapster.service.name $namespace }}
{{- $heapsterInternalPort := .Values.heapster.service.port.internal | toString }}
{{- $_ := set $data "CP_HEAPSTER_INTERNAL_HOST" $heapsterInternalHost -}}
{{- $_ := set $data "CP_HEAPSTER_INTERNAL_PORT" $heapsterInternalPort -}}
{{- end }}
{{- /* vm-monitor checks the metrics deployment that runs, not the one replaced */}}
{{- if .Values.vmMonitor.enabled }}
{{- $deploymentNames := .Values.vmMonitor.deploymentNames | default list -}}
{{- if .Values.heapster.enabled }}{{ $deploymentNames = append $deploymentNames "cp-heapster" }}{{ end -}}
{{- if .Values.metricsCollector.enabled }}{{ $deploymentNames = append $deploymentNames "cp-metrics-collector" }}{{ end -}}
{{- $_ := set $data "CP_VM_MONITOR_DEPLOY_NAMES" (join "," $deploymentNames) -}}
{{- end }}
{{- $config := .Values.config | default dict -}}
{{- range $key, $value := $config -}}
{{- $_ := set $data $key ($value | toString) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-to-update-{{ .Values.service.name }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{ include "lib.cpConfigGlobal.patchHookTemplate" (dict "context" . "jobName" (printf "patch-config-global-%s" .Values.service.name) "hookWeight" "2" "activeDeadlineSeconds" 120) }}
{{- end }}
