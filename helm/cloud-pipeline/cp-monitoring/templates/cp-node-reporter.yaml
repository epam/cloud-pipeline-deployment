{{- if .Values.nodeReporter.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cp-node-reporter
  namespace: {{ include "lib.application.namespace" . }}
  labels:
    cloud-pipeline/cp-node-reporter: "true"
    cloud-pipeline/core-component: "DaemonSet"
spec:
  selector:
    matchLabels:
      cloud-pipeline/cp-node-reporter: "true"
  template:
    metadata:
      annotations:
        deploy-timestamp: "{{ now | date "2006-01-02_15:04:05" }}"
      labels:
        cloud-pipeline/cp-node-reporter: "true"
        cloud-pipeline/core-component: "DaemonSet"
    spec:
      {{- include "lib.imagePullSecret" . | nindent 6 }}
      hostPID: true
      nodeSelector:
        beta.kubernetes.io/os: "linux"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cp-node-reporter
          {{- $imageVersion := required "buildVersion must be set (set general.buildVersion in values.yaml. You also can override specific value with image.buildVersion value for each service pod)" (coalesce .Values.nodeReporter.image.buildVersion .Values.buildVersion "") }}
          {{- $imageTag := ternary .Values.nodeReporter.image.tag (printf "%s-%s" .Values.nodeReporter.image.tag $imageVersion) (hasPrefix "sha" .Values.nodeReporter.image.tag) }}
          image: "{{ .Values.nodeReporter.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.nodeReporter.image.pullPolicy }}
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: cp-config-global
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CP_NODE_REPORTER_STATS_PORT
              value: "8000"
            - name: CP_NODE_REPORTER_OOM_HOSTS_INCLUDE
              value: "*"
            - name: CP_NODE_REPORTER_STATS_HOSTS_INCLUDE
              value: "*"
            - name: CP_NODE_REPORTER_STATS_PROCS_INCLUDE
              value: "dockerd,docker-containerd,containerd"
            - name: CP_LOGGING_LEVEL
              value: "DEBUG"
            - name: CP_LOGGING_DIR
              value: "/opt/node-reporter/logs"
            - name: CP_LOGGING_HISTORY
              value: "10"
            - name: CP_RESOURCES_DIR
              value: "/opt/node-reporter/resources"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: CP_API_JWT_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lib.cpApiTokenSecretName" . }}
                  key: CP_API_JWT_ADMIN
          volumeMounts:
            - name: logs
              mountPath: /opt/node-reporter/logs
            - name: resources
              mountPath: /opt/node-reporter/resources
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: docker-bin
              mountPath: /usr/bin/docker
      volumes:
        - name: logs
          hostPath:
            path: /opt/node-reporter/logs
            type: DirectoryOrCreate
        - name: resources
          hostPath:
            path: /opt/node-reporter/resources
            type: DirectoryOrCreate
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: docker-bin
          hostPath:
            path: /usr/bin/docker
{{- end }}
