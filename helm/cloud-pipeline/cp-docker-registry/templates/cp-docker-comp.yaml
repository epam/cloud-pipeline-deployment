apiVersion: v1
kind: Service
metadata:
  name: cp-docker-comp
  namespace: {{ include "lib.application.namespace" . }}
  labels:
    cloud-pipeline/cp-docker-comp: "true"
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: {{ .Values.config.CP_DOCKER_COMP_INTERNAL_PORT }}
      targetPort: 8080
      name: cp-docker-comp-port-http
  selector:
    cloud-pipeline/cp-docker-comp: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-docker-comp
  namespace: {{ include "lib.application.namespace" . }}
  labels:
    cloud-pipeline/cp-docker-comp: "true"
spec:
  selector:
    matchLabels:
      cloud-pipeline/cp-docker-comp: "true"
  replicas: 1
  # Recreate: hostPath working directory cannot be shared between old and new pod simultaneously.
  strategy:
    type: Recreate
  template:
    metadata:
      namespace: {{ include "lib.application.namespace" . }}
      annotations:
        deploy-timestamp: "{{ now | date "2006-01-02_15:04:05" }}"
      labels:
        cloud-pipeline/cp-docker-comp: "true"
        cloud-pipeline/core-component: "Deployment"
    spec:
      {{- include "lib.imagePullSecret" . | nindent 6 }}
      nodeSelector:
        cloud-pipeline/cp-docker-comp: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cp-docker-comp
          {{- $imageVersion := required "buildVersion must be set (set general.buildVersion in values.yaml. You also can override specific value with image.buildVersion value for each service pod)" (coalesce .Values.dockerComp.image.buildVersion .Values.buildVersion "") }}
          {{- $imageRef := ternary (printf "%s@%s" .Values.image.repository .Values.dockerComp.image.tag) (printf "%s:%s-%s" .Values.image.repository .Values.dockerComp.image.tag $imageVersion) (hasPrefix "sha256:" .Values.dockerComp.image.tag) }}
          image: {{ $imageRef }}
          imagePullPolicy: {{ .Values.dockerComp.image.pullPolicy }}
          command: ["/init"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cp-config-global
          volumeMounts:
            - mountPath: {{ .Values.config.CP_DOCKER_COMP_WORKING_DIR | quote }}
              name: docker-comp-wd
      volumes:
        - name: docker-comp-wd
          hostPath:
            path: {{ printf "%s/docker-comp/wd" .Values.hostPath.basePath | quote }}
            type: DirectoryOrCreate
