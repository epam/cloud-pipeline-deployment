{{- $namespace := include "lib.application.namespace" . -}}
{{- $service := .Values.service | default dict -}}
{{- $serviceHost := index $service "host" | default dict -}}
{{- $servicePort := index $service "port" | default dict -}}
{{- $internalHost := index $serviceHost "internal" | default "" | toString | trim -}}
{{- $externalHost := index $serviceHost "external" | default "" | toString | trim -}}
{{- $internalPort := index $servicePort "internal" | default "443" | toString | trim -}}
{{- $externalPort := index $servicePort "external" | default "443" | toString | trim -}}
{{- if and (ne $externalHost "") (or (eq $internalHost "") (contains ".svc.cluster.local" $internalHost)) -}}
{{- $internalHost = $externalHost -}}
{{- $internalPort = $externalPort -}}
{{- end -}}
{{- if eq $internalHost "" -}}
{{- $internalHost = printf "cp-docker-registry.%s.svc.cluster.local" $namespace -}}
{{- end -}}
{{- $data := dict -}}
{{- range $key, $value := (.Values.config | default dict) -}}
{{- $_ := set $data $key (toString $value) -}}
{{- end -}}
{{- $_ := set $data "CP_DOCKER_EXTERNAL_HOST" $externalHost -}}
{{- $_ := set $data "CP_DOCKER_INTERNAL_HOST" $internalHost -}}
{{- $_ := set $data "CP_DOCKER_EXTERNAL_PORT" $externalPort -}}
{{- $_ := set $data "CP_DOCKER_INTERNAL_PORT" $internalPort -}}
{{- $_ := set $data "CP_DOCKER_COMP_INTERNAL_HOST" (printf "cp-docker-comp.%s.svc.cluster.local" $namespace) -}}
{{- $_ := set $data "CP_CLAIR_INTERNAL_HOST" (printf "cp-clair.%s.svc.cluster.local" $namespace) -}}
{{- $_ := set $data "CP_CLAIR_DATABASE_HOST" (printf "cp-api-db.%s.svc.cluster.local" $namespace) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-to-update-cp-docker-registry
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{ include "lib.cpConfigGlobal.patchHookTemplate" (dict "context" . "jobName" "patch-config-global-docker-registry" "hookWeight" "2" "activeDeadlineSeconds" 900) }}
