{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cp-hook-script-register-search-preferences
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "29"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  register-search-preferences.sh: |
{{ .Files.Get "files/hooks/register-search-preferences.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-search-preferences
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      serviceAccountName: {{ include "lib.hook.serviceaccount" . }}
      restartPolicy: Never
      containers:
        - name: register-search-preferences
          image: {{ include "lib.hook.deploymentImage" . }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cp-config-global
          env:
            - name: NAMESPACE
              value: {{ include "lib.application.namespace" . | quote }}
            - name: CP_API_JWT_ADMIN
              valueFrom:
                secretKeyRef:
                  name: cp-api-token
                  key: CP_API_JWT_ADMIN
          command: ["/bin/bash", "/scripts/register-search-preferences.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: cp-hook-script-register-search-preferences
            defaultMode: 0755
{{- end }}
