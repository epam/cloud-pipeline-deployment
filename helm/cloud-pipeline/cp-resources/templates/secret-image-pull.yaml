{{- $ipc := .Values.imagePullCredentials | default dict -}}
{{- $user := index $ipc "user" | default "" -}}
{{- $password := index $ipc "password" | default "" -}}
{{- if and $user $password -}}
{{- $registry := index $ipc "registry" | default "https://index.docker.io/v1/" -}}
{{- $auth := printf "%s:%s" $user $password | b64enc -}}
{{- $dockerconfigjson := printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" $registry $auth | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: cp-distr-docker-registry-secret
  namespace: {{ include "lib.application.namespace" . }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfigjson }}
{{- end }}
