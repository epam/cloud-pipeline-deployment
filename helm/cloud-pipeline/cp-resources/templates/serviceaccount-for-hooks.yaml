apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lib.hook.serviceaccount" . }}
  namespace: {{ include "lib.application.namespace" . }}
---
# Role for Helm hook Jobs (JWT, certs, kube creds).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cp-hook-service-account-role
  namespace: {{ include "lib.application.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "create", "patch", "update", "list"]
  # Secrets: explicit rule (hooks patch cp-idp-secret, cp-pki-secret, jwt secrets, etc.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# RoleBinding: hook SA → hook Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cp-hook-service-account-binding
  namespace: {{ include "lib.application.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lib.hook.serviceaccount" . }}
    namespace: {{ include "lib.application.namespace" . }}
roleRef:
  kind: Role
  name: cp-hook-service-account-role
  apiGroup: rbac.authorization.k8s.io
---
# kube-system RoleBinding so patch-dnsmasq Job can read kube-dns SA (lib.patchDNSJob).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cp-dnsmasq-hosts-patcher
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cp-dnsmasq-hosts"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kube-dns"]
    verbs: ["get", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cp-dnsmasq-hosts-hook-sa-binding
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: {{ include "lib.hook.serviceaccount" . }}
    namespace: {{ include "lib.application.namespace" . }}
roleRef:
  kind: Role
  name: cp-dnsmasq-hosts-patcher
  apiGroup: rbac.authorization.k8s.io
