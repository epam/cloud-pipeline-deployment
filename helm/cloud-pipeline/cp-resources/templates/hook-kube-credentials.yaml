# Pre-hook: RBAC in kube-system + Job to patch cp-config-global with kubeadm/node tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cp-kube-credentials-hook
  namespace: "kube-system"
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-60"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  # kubectl create token for kube-system/canal when legacy .secrets[] is empty (K8s 1.24+)
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["canal"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cp-kube-credentials-hook
  namespace: "kube-system"
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-60"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "lib.hook.serviceaccount" . }}
    namespace: {{ include "lib.application.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cp-kube-credentials-hook
---
# ClusterRoleBindings applied by Helm (not the hook pod).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-cp-default-sa-cluster-admin" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-55"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "lib.application.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-cp-kube-dns-view" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-55"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kube-dns
    namespace: "kube-system"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cp-hook-script-kube-credentials
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-41"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  kube-credentials.sh: |
{{ .Files.Get "files/hooks/kube-credentials.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-credentials
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      serviceAccountName: {{ include "lib.hook.serviceaccount" . }}
      restartPolicy: Never
      containers:
        - name: patch-cp-config-global
          image: {{ include "lib.hook.deploymentImage" . | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ include "lib.application.namespace" . | quote }}
            - name: KUBE_SYSTEM_NS
              value: "kube-system"
            - name: CANAL_SA
              value: "canal"
          command: ["/bin/bash", "/scripts/kube-credentials.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: cp-hook-script-kube-credentials
            defaultMode: 0755
