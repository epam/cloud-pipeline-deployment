{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ include "lib.application.namespace" . }}
  labels:
    cloud-pipeline/cp-dav: "true"
    cloud-pipeline/core-component: "Service"
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.service.port.internal | int }}
      targetPort: {{ .Values.service.port.internal | int }}
      name: cp-dav-port-http
    - protocol: TCP
      port: {{ .Values.service.port.extraInternal | int }}
      targetPort: {{ .Values.service.port.extraInternal | int }}
      name: cp-dav-extra-port-http
  selector:
    cloud-pipeline/cp-dav: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-dav
  namespace: {{ include "lib.application.namespace" . }}
  labels:
    cloud-pipeline/cp-dav: "true"
    cloud-pipeline/core-component: "Deployment"
spec:
  selector:
    matchLabels:
      cloud-pipeline/cp-dav: "true"
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        deploy-timestamp: "{{ now | date "2006-01-02_15:04:05" }}"
      labels:
        cloud-pipeline/cp-dav: "true"
        cloud-pipeline/core-component: "Deployment"
    spec:
      {{- include "lib.imagePullSecret" . | nindent 6 }}
      nodeSelector:
        cloud-pipeline/cp-dav: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cp-dav
          {{- $imageVersion := required "buildVersion must be set (set general.buildVersion in values.yaml. You also can override specific value with image.buildVersion value for each service pod)" (coalesce .Values.image.buildVersion .Values.buildVersion "") }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if $imageVersion }}-{{ $imageVersion }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          command: ["/init"]
          envFrom:
            - configMapRef:
                name: cp-config-global
          env:
            - name: CP_API_JWT_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lib.cpApiTokenSecretName" . }}
                  key: CP_API_JWT_ADMIN
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /liveness.sh
            initialDelaySeconds: 600
            periodSeconds: 300
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /{{ .Values.config.CP_DAV_URL_PATH }}
              port: {{ .Values.service.port.internal | int }}
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/log/dav
              name: dav-logs
            - mountPath: /opt/api/pki
              name: api-pki
              readOnly: true
      volumes:
        - name: dav-logs
          hostPath:
            path: {{ .Values.logsHostPath }}
            type: DirectoryOrCreate
        - name: api-pki
          projected:
            sources:
              - secret:
                  name: cp-pki-secret
              - secret:
                  name: cp-jwt-pki-secret
{{- end }}
