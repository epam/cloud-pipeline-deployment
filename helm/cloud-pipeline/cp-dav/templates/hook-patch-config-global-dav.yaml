{{- $service := .Values.service | default dict -}}
{{- $servicePort := index $service "port" | default dict -}}
{{- $config := .Values.config | default dict -}}
{{- $defaultInternalHost := printf "cp-dav.%s.svc.cluster.local" (include "lib.application.namespace" .) -}}
{{- $data := dict -}}
{{- $_ := set $data "CP_DAV_INTERNAL_HOST" $defaultInternalHost -}}
{{- $_ := set $data "CP_DAV_INTERNAL_PORT" (index $servicePort "internal" | default "31085" | toString) -}}
{{- range $key, $value := $config -}}
{{- $_ := set $data $key ($value | toString) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-to-update-cp-dav
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{ include "lib.cpConfigGlobal.patchHookTemplate" (dict "context" . "hookWeight" "-8") }}
