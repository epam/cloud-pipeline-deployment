{{- if .Values.enabled }}
{{- $namespace := include "lib.application.namespace" . -}}
{{- $service := .Values.service | default dict -}}
{{- $serviceHost := index $service "host" | default dict -}}
{{- $servicePort := index $service "port" | default dict -}}
{{- $internalHost := index $serviceHost "internal" | default "" | toString | trim -}}
{{- $externalHost := index $serviceHost "external" | default "" | toString | trim -}}
{{- $internalPort := index $servicePort "internal" | default "443" | toString | trim -}}
{{- $externalPort := index $servicePort "external" | default "443" | toString | trim -}}

{{- if eq $internalHost "" -}}
{{- if ne $externalHost "" -}}
{{- $internalHost = $externalHost -}}
{{- $internalPort = $externalPort -}}
{{- else -}}
{{- $internalHost = printf "cp-git.%s.svc.cluster.local" $namespace -}}
{{- end -}}
{{- end -}}

{{- $config := .Values.config | default dict -}}
{{- $data := dict -}}

{{- range $key, $value := $config -}}
{{- $_ := set $data $key ($value | toString) -}}
{{- end -}}

{{/* Self-heal a known-weak/placeholder root password, mirroring the legacy install.sh behavior for
     CP_GITLAB_VERSION >= 17: GitLab's password-strength check rejects "Passw0rd" placeholder outright
     ("Password must not contain commonly used combinations of words and letters"), so GitLab never
     seeds a root user when it's left in place. lookup reflects the end of the previous deploy (or an
     empty dict on first install / on helm template without a live cluster), so an already-generated
     strong password is kept as-is rather than regenerated on every redeploy. */}}
{{- $weakRootPasswords := list "" "Passw0rd" -}}
{{- $desiredRootPassword := index $data "GITLAB_ROOT_PASSWORD" | default "" -}}
{{- if or (has $desiredRootPassword $weakRootPasswords) (lt (len $desiredRootPassword) 8) -}}
{{- $existingConfigGlobal := lookup "v1" "ConfigMap" $namespace "cp-config-global" -}}
{{- $existingRootPassword := "" -}}
{{- if $existingConfigGlobal -}}
{{- $existingRootPassword = index ($existingConfigGlobal.data | default dict) "GITLAB_ROOT_PASSWORD" | default "" -}}
{{- end -}}
{{- if and (not (has $existingRootPassword $weakRootPasswords)) (ge (len $existingRootPassword) 8) -}}
{{- $_ := set $data "GITLAB_ROOT_PASSWORD" $existingRootPassword -}}
{{- else -}}
{{- $_ := set $data "GITLAB_ROOT_PASSWORD" (randAlphaNum 16) -}}
{{- end -}}
{{- end -}}

{{- $_ := set $data "GITLAB_DATABASE_HOST" (printf "cp-gitlab-db.%s.svc.cluster.local" $namespace) -}}
{{- $_ := set $data "GITLAB_HOST" (printf "cp-git.%s.svc.cluster.local" $namespace) -}}
{{- $_ := set $data "CP_GITLAB_EXTERNAL_HOST" $externalHost -}}
{{- $_ := set $data "CP_GITLAB_EXTERNAL_PORT" $externalPort -}}
{{- $_ := set $data "CP_GITLAB_INTERNAL_HOST" $internalHost -}}
{{- $_ := set $data "CP_GITLAB_INTERNAL_PORT" $internalPort -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-to-update-{{ .Values.service.name }}
  namespace: {{ include "lib.application.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{ include "lib.cpConfigGlobal.patchHookTemplate" (dict "context" . "hookWeight" "-7") }}
{{- end }}
