name: ShellCheck

on:
  pull_request:
    paths:
      - '**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        working-directory: ${{ github.workspace }}
        run: |
          find . -name '*.sh' \
            -not -path './helm/hooks/post-deploy/assets/*' \
            -print0 | xargs -0 shellcheck --severity=warning
